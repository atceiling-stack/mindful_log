<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindful Log - 個人寫作與心情日記</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            200: '#e8d5ce',
                            300: '#d7b3a5',
                            400: '#c58e7b',
                            500: '#b46d57',
                            600: '#9d533e',
                            700: '#834231',
                            800: '#6d382b',
                            900: '#5a3127',
                        },
                        amber: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.7);
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 dark:bg-stone-900 dark:text-stone-100 transition-colors duration-300 min-h-full flex flex-col font-sans selection:bg-primary-200 dark:selection:bg-primary-900">

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 flex items-center gap-3 bg-stone-800 text-white dark:bg-stone-100 dark:text-stone-900 px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-600"></i>
        <span id="toast-message" class="text-sm font-medium">提示訊息</span>
    </div>

    <!-- Main Header -->
    <header class="sticky top-0 z-30 bg-white/80 dark:bg-stone-900/80 backdrop-blur-md border-b border-stone-200 dark:border-stone-800 transition-colors">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <!-- Logo -->
            <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('entries')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-primary-500 to-amber-400 flex items-center justify-center text-white shadow-md shadow-primary-500/20">
                    <i class="fa-solid fa-book-bookmark text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-tight text-stone-800 dark:text-stone-100">Mindful Log</h1>
                    <p class="text-xs text-stone-500 dark:text-stone-400 hidden sm:block">記錄生活，傾聽內心</p>
                </div>
            </div>

            <!-- Header Actions -->
            <div class="flex items-center gap-2 sm:gap-3">
                <button onclick="openEntryModal()" class="flex items-center gap-2 bg-primary-600 hover:bg-primary-700 active:scale-95 text-white text-sm font-medium px-4 py-2 rounded-xl transition shadow-md shadow-primary-600/20">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">撰寫日記</span>
                </button>

                <!-- Theme Toggle -->
                <button id="theme-toggle" onclick="toggleDarkMode()" class="p-2.5 rounded-xl hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-600 dark:text-stone-300 transition" title="切換主題">
                    <i class="fa-solid fa-moon text-lg dark:hidden"></i>
                    <i class="fa-solid fa-sun text-lg hidden dark:block text-amber-400"></i>
                </button>

                <!-- Data Backup / Import -->
                <div class="relative group">
                    <button class="p-2.5 rounded-xl hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-600 dark:text-stone-300 transition" title="資料備份與設定">
                        <i class="fa-solid fa-gear text-lg"></i>
                    </button>
                    <div class="absolute right-0 mt-2 w-48 bg-white dark:bg-stone-800 rounded-2xl shadow-xl border border-stone-100 dark:border-stone-700 py-2 hidden group-hover:block z-40">
                        <button onclick="exportData()" class="w-full text-left px-4 py-2.5 text-sm hover:bg-stone-50 dark:hover:bg-stone-700/50 flex items-center gap-2.5 text-stone-700 dark:text-stone-200">
                            <i class="fa-solid fa-download text-primary-500"></i> 匯出備份 (JSON)
                        </button>
                        <label class="w-full text-left px-4 py-2.5 text-sm hover:bg-stone-50 dark:hover:bg-stone-700/50 flex items-center gap-2.5 text-stone-700 dark:text-stone-200 cursor-pointer">
                            <i class="fa-solid fa-upload text-amber-500"></i> 匯入備份 (JSON)
                            <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Body Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">

        <!-- Top Overview Banner / Stats Ribbon -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
            <div class="bg-white dark:bg-stone-800/80 p-4 rounded-2xl border border-stone-200/80 dark:border-stone-700/50 flex items-center gap-3.5 shadow-sm">
                <div class="p-3 rounded-xl bg-amber-500/10 text-amber-500 dark:bg-amber-500/20">
                    <i class="fa-solid fa-fire text-xl"></i>
                </div>
                <div>
                    <div class="text-xs text-stone-500 dark:text-stone-400 font-medium">連續紀錄</div>
                    <div class="text-xl font-bold tracking-tight mt-0.5"><span id="stat-streak">0</span> 天</div>
                </div>
            </div>
            <div class="bg-white dark:bg-stone-800/80 p-4 rounded-2xl border border-stone-200/80 dark:border-stone-700/50 flex items-center gap-3.5 shadow-sm">
                <div class="p-3 rounded-xl bg-primary-500/10 text-primary-500 dark:bg-primary-500/20">
                    <i class="fa-solid fa-book text-xl"></i>
                </div>
                <div>
                    <div class="text-xs text-stone-500 dark:text-stone-400 font-medium">日記總數</div>
                    <div class="text-xl font-bold tracking-tight mt-0.5"><span id="stat-total">0</span> 篇</div>
                </div>
            </div>
            <div class="bg-white dark:bg-stone-800/80 p-4 rounded-2xl border border-stone-200/80 dark:border-stone-700/50 flex items-center gap-3.5 shadow-sm">
                <div class="p-3 rounded-xl bg-emerald-500/10 text-emerald-500 dark:bg-emerald-500/20">
                    <i class="fa-solid fa-face-smile text-xl"></i>
                </div>
                <div>
                    <div class="text-xs text-stone-500 dark:text-stone-400 font-medium">最常心情</div>
                    <div class="text-xl font-bold tracking-tight mt-0.5" id="stat-top-mood">-</div>
                </div>
            </div>
            <div class="bg-white dark:bg-stone-800/80 p-4 rounded-2xl border border-stone-200/80 dark:border-stone-700/50 flex items-center gap-3.5 shadow-sm">
                <div class="p-3 rounded-xl bg-sky-500/10 text-sky-500 dark:bg-sky-500/20">
                    <i class="fa-solid fa-hashtag text-xl"></i>
                </div>
                <div>
                    <div class="text-xs text-stone-500 dark:text-stone-400 font-medium">常用標籤</div>
                    <div class="text-xl font-bold tracking-tight mt-0.5 truncate max-w-[100px]" id="stat-top-tag">-</div>
                </div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex items-center justify-between border-b border-stone-200 dark:border-stone-800 pb-2">
            <nav class="flex gap-2">
                <button id="tab-entries" onclick="switchTab('entries')" class="px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 text-primary-600 bg-primary-50 dark:bg-primary-950/50 dark:text-primary-400">
                    <i class="fa-solid fa-list-ul"></i> 日記列表
                </button>
                <button id="tab-calendar" onclick="switchTab('calendar')" class="px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 text-stone-600 hover:bg-stone-100 dark:text-stone-400 dark:hover:bg-stone-800">
                    <i class="fa-regular fa-calendar-days"></i> 月曆視圖
                </button>
                <button id="tab-stats" onclick="switchTab('stats')" class="px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 text-stone-600 hover:bg-stone-100 dark:text-stone-400 dark:hover:bg-stone-800">
                    <i class="fa-solid fa-chart-pie"></i> 心情統計
                </button>
            </nav>
        </div>

        <!-- Tab 1: Entries List View -->
        <section id="view-entries" class="flex flex-col gap-5">
            <!-- Filter & Search Control Bar -->
            <div class="bg-white dark:bg-stone-800/80 p-4 rounded-2xl border border-stone-200/80 dark:border-stone-700/50 flex flex-col md:flex-row gap-3 justify-between items-center shadow-sm">
                <!-- Search Box -->
                <div class="relative w-full md:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400 text-sm"></i>
                    <input type="text" id="search-input" oninput="renderEntries()" placeholder="搜尋內文、標題或標籤..." class="w-full pl-10 pr-4 py-2 rounded-xl bg-stone-50 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/50">
                </div>

                <!-- Filters -->
                <div class="flex flex-wrap items-center gap-2 w-full md:w-auto justify-start md:justify-end">
                    <!-- Mood Filter -->
                    <select id="filter-mood" onchange="renderEntries()" class="px-3 py-2 rounded-xl bg-stone-50 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/50">
                        <option value="ALL">全部心情</option>
                        <option value="😊">😊 開心</option>
                        <option value="😌">😌 平靜</option>
                        <option value="🥰">🥰 感恩</option>
                        <option value="😔">😔 低落</option>
                        <option value="😤">😤 焦慮/生氣</option>
                        <option value="😴">😴 疲憊</option>
                    </select>

                    <!-- Tag Filter -->
                    <select id="filter-tag" onchange="renderEntries()" class="px-3 py-2 rounded-xl bg-stone-50 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/50">
                        <option value="ALL">全部標籤</option>
                    </select>

                    <!-- Sort Order -->
                    <select id="sort-order" onchange="renderEntries()" class="px-3 py-2 rounded-xl bg-stone-50 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/50">
                        <option value="desc">最新優先</option>
                        <option value="asc">最舊優先</option>
                    </select>
                </div>
            </div>

            <!-- Entries Cards Grid -->
            <div id="entries-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- JS Inject Content Here -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center">
                <div class="w-20 h-20 bg-stone-100 dark:bg-stone-800 rounded-full flex items-center justify-center text-stone-400 mb-4 text-3xl">
                    <i class="fa-regular fa-folder-open"></i>
                </div>
                <h3 class="font-semibold text-lg text-stone-700 dark:text-stone-300">尚未找到任何日記紀錄</h3>
                <p class="text-sm text-stone-500 dark:text-stone-400 max-w-sm mt-1">試著調整篩選條件，或是按下「撰寫日記」開始記錄今天的故事吧！</p>
                <button onclick="openEntryModal()" class="mt-4 px-4 py-2 bg-primary-600 text-white rounded-xl text-sm font-medium hover:bg-primary-700 transition">寫下第一篇日記</button>
            </div>
        </section>

        <!-- Tab 2: Calendar View -->
        <section id="view-calendar" class="hidden flex-col gap-4">
            <div class="bg-white dark:bg-stone-800/80 p-5 rounded-2xl border border-stone-200/80 dark:border-stone-700/50 shadow-sm">
                <!-- Calendar Header -->
                <div class="flex items-center justify-between mb-6">
                    <h2 id="calendar-month-year" class="text-lg font-bold text-stone-800 dark:text-stone-100"></h2>
                    <div class="flex items-center gap-2">
                        <button onclick="changeMonth(-1)" class="p-2 rounded-xl hover:bg-stone-100 dark:hover:bg-stone-700 text-stone-600 dark:text-stone-300">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <button onclick="goToCurrentMonth()" class="px-3 py-1.5 rounded-xl border border-stone-200 dark:border-stone-700 text-xs font-medium hover:bg-stone-100 dark:hover:bg-stone-700">
                            本月
                        </button>
                        <button onclick="changeMonth(1)" class="p-2 rounded-xl hover:bg-stone-100 dark:hover:bg-stone-700 text-stone-600 dark:text-stone-300">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Calendar Weekdays -->
                <div class="calendar-grid text-center font-medium text-xs text-stone-400 mb-2">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>

                <!-- Calendar Grid Cells -->
                <div id="calendar-days" class="calendar-grid gap-1 sm:gap-2">
                    <!-- JS Grid Inject -->
                </div>
            </div>
        </section>

        <!-- Tab 3: Statistics View -->
        <section id="view-stats" class="hidden flex-col gap-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Chart 1: Mood Distribution -->
                <div class="bg-white dark:bg-stone-800/80 p-5 rounded-2xl border border-stone-200/80 dark:border-stone-700/50 shadow-sm flex flex-col items-center">
                    <h3 class="text-base font-bold text-stone-800 dark:text-stone-100 mb-4 w-full text-left">心情佔比分析</h3>
                    <div class="w-full max-w-[280px] h-[280px] relative">
                        <canvas id="moodChart"></canvas>
                    </div>
                </div>

                <!-- Tag Cloud & Insights -->
                <div class="bg-white dark:bg-stone-800/80 p-5 rounded-2xl border border-stone-200/80 dark:border-stone-700/50 shadow-sm flex flex-col">
                    <h3 class="text-base font-bold text-stone-800 dark:text-stone-100 mb-4">熱門話題標籤</h3>
                    <div id="tag-cloud" class="flex flex-wrap gap-2 flex-1 items-start">
                        <!-- JS Tags Inject -->
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Entry Modal (Add / Edit / Detail) -->
    <div id="entry-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white dark:bg-stone-800 w-full max-w-2xl rounded-3xl shadow-2xl border border-stone-200/80 dark:border-stone-700 overflow-hidden flex flex-col max-h-[90vh] transform scale-95 transition-transform duration-300" id="entry-modal-panel">
            
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-stone-100 dark:border-stone-700/60 flex items-center justify-between">
                <h3 id="modal-title" class="font-bold text-lg text-stone-800 dark:text-stone-100">撰寫新日記</h3>
                <button onclick="closeEntryModal()" class="p-2 rounded-full hover:bg-stone-100 dark:hover:bg-stone-700 text-stone-400 hover:text-stone-600 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Modal Content (Form) -->
            <form id="entry-form" onsubmit="handleFormSubmit(event)" class="p-6 overflow-y-auto space-y-4 flex-1">
                <input type="hidden" id="entry-id">

                <!-- Date & Mood Pickers -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-stone-500 dark:text-stone-400 mb-1">日期</label>
                        <input type="date" id="entry-date" required class="w-full px-3.5 py-2.5 rounded-xl bg-stone-50 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/50">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-500 dark:text-stone-400 mb-1">今日心情</label>
                        <div class="flex items-center justify-between bg-stone-50 dark:bg-stone-900 p-1.5 rounded-xl border border-stone-200 dark:border-stone-700">
                            <button type="button" onclick="selectMood('😊')" class="mood-btn p-2 rounded-lg text-xl hover:bg-white dark:hover:bg-stone-800 transition" data-mood="😊" title="開心">😊</button>
                            <button type="button" onclick="selectMood('😌')" class="mood-btn p-2 rounded-lg text-xl hover:bg-white dark:hover:bg-stone-800 transition" data-mood="😌" title="平靜">😌</button>
                            <button type="button" onclick="selectMood('🥰')" class="mood-btn p-2 rounded-lg text-xl hover:bg-white dark:hover:bg-stone-800 transition" data-mood="🥰" title="感恩">🥰</button>
                            <button type="button" onclick="selectMood('😔')" class="mood-btn p-2 rounded-lg text-xl hover:bg-white dark:hover:bg-stone-800 transition" data-mood="😔" title="低落">😔</button>
                            <button type="button" onclick="selectMood('😤')" class="mood-btn p-2 rounded-lg text-xl hover:bg-white dark:hover:bg-stone-800 transition" data-mood="😤" title="焦慮">😤</button>
                            <button type="button" onclick="selectMood('😴')" class="mood-btn p-2 rounded-lg text-xl hover:bg-white dark:hover:bg-stone-800 transition" data-mood="😴" title="疲憊">😴</button>
                        </div>
                        <input type="hidden" id="entry-mood" value="😊">
                    </div>
                </div>

                <!-- Title -->
                <div>
                    <label class="block text-xs font-semibold text-stone-500 dark:text-stone-400 mb-1">日記標題</label>
                    <input type="text" id="entry-title" required placeholder="給今天下一個標題吧..." class="w-full px-3.5 py-2.5 rounded-xl bg-stone-50 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/50">
                </div>

                <!-- Content -->
                <div>
                    <label class="block text-xs font-semibold text-stone-500 dark:text-stone-400 mb-1">內文</label>
                    <textarea id="entry-content" rows="6" required placeholder="記錄今天的經歷、想法與感受..." class="w-full px-3.5 py-2.5 rounded-xl bg-stone-50 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/50 leading-relaxed"></textarea>
                </div>

                <!-- Image URL -->
                <div>
                    <label class="block text-xs font-semibold text-stone-500 dark:text-stone-400 mb-1">圖片連結 (選填)</label>
                    <input type="url" id="entry-image" placeholder="https://images.unsplash.com/..." class="w-full px-3.5 py-2.5 rounded-xl bg-stone-50 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/50">
                </div>

                <!-- Tags -->
                <div>
                    <label class="block text-xs font-semibold text-stone-500 dark:text-stone-400 mb-1">標籤 (以逗號分隔)</label>
                    <input type="text" id="entry-tags" placeholder="工作, 旅遊, 靈感, 生活" class="w-full px-3.5 py-2.5 rounded-xl bg-stone-50 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/50">
                </div>

                <!-- Actions -->
                <div class="pt-4 flex items-center justify-between border-t border-stone-100 dark:border-stone-700/60">
                    <button type="button" id="btn-delete" onclick="deleteCurrentEntry()" class="px-4 py-2 rounded-xl border border-rose-200 dark:border-rose-900 text-rose-600 dark:text-rose-400 text-sm font-medium hover:bg-rose-50 dark:hover:bg-rose-950/30 transition hidden">
                        <i class="fa-regular fa-trash-can mr-1"></i> 刪除
                    </button>
                    <div class="flex items-center gap-2 ml-auto">
                        <button type="button" onclick="closeEntryModal()" class="px-4 py-2 rounded-xl text-stone-600 dark:text-stone-300 text-sm font-medium hover:bg-stone-100 dark:hover:bg-stone-700 transition">
                            取消
                        </button>
                        <button type="submit" class="px-5 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded-xl text-sm font-medium transition shadow-md shadow-primary-600/20">
                            儲存日記
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Read Detail Modal -->
    <div id="detail-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white dark:bg-stone-800 w-full max-w-2xl rounded-3xl shadow-2xl border border-stone-200/80 dark:border-stone-700 overflow-hidden flex flex-col max-h-[90vh] transform scale-95 transition-transform duration-300" id="detail-modal-panel">
            <div id="detail-content" class="overflow-y-auto p-6 space-y-4">
                <!-- Inject Detail Here -->
            </div>
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        // --- State Management ---
        let entries = [];
        let currentCalendarDate = new Date();
        let moodChartInstance = null;

        // Default mock data if storage is empty
        const initialMockEntries = [
            {
                id: '1',
                date: new Date().toISOString().split('T')[0],
                mood: '😊',
                title: '探索新咖啡廳的午後',
                content: '今天午後去了一家隱身在巷弄裡的手沖咖啡館。點了一杯淺焙的哥倫比亞，聽著柔和的爵士樂，享受難得的寧靜時刻。讀完了上週買的小說，心靈感到充實且放鬆。',
                image: 'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=800&q=80',
                tags: ['生活', '咖啡', '閱讀']
            },
            {
                id: '2',
                date: new Date(Date.now() - 86400000).toISOString().split('T')[0],
                mood: '🥰',
                title: '團隊專案順利上線',
                content: '歷經三個月的努力，我們的新產品今天終於正式上線了！團隊成員大家一起吃了慶祝晚餐，非常感激能有這些優秀又互相信任的夥伴。',
                image: '',
                tags: ['工作', '成就']
            }
        ];

        // --- Core Functions ---
        window.onload = function() {
            loadEntries();
            initTheme();
            renderAllViews();
        };

        function loadEntries() {
            const saved = localStorage.getItem('mindful_log_entries');
            if (saved) {
                try {
                    entries = JSON.parse(saved);
                } catch(e) {
                    entries = initialMockEntries;
                }
            } else {
                entries = initialMockEntries;
                saveEntries();
            }
        }

        function saveEntries() {
            localStorage.setItem('mindful_log_entries', JSON.stringify(entries));
            renderAllViews();
        }

        function renderAllViews() {
            updateStats();
            updateTagFilterOptions();
            renderEntries();
            renderCalendar();
            renderChart();
        }

        // --- Theme Logic ---
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
            // Re-render chart on theme change to adjust text colors
            renderChart();
        }

        // --- Navigation / Tabs ---
        function switchTab(tabName) {
            const views = ['entries', 'calendar', 'stats'];
            views.forEach(v => {
                const el = document.getElementById(`view-${v}`);
                const btn = document.getElementById(`tab-${v}`);
                if (v === tabName) {
                    el.classList.remove('hidden');
                    el.classList.add('flex');
                    btn.className = "px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 text-primary-600 bg-primary-50 dark:bg-primary-950/50 dark:text-primary-400";
                } else {
                    el.classList.add('hidden');
                    el.classList.remove('flex');
                    btn.className = "px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 text-stone-600 hover:bg-stone-100 dark:text-stone-400 dark:hover:bg-stone-800";
                }
            });

            if (tabName === 'stats') {
                renderChart();
            }
        }

        // --- Statistics Calculations ---
        function updateStats() {
            document.getElementById('stat-total').innerText = entries.length;

            // Streak calculation
            const dates = Array.from(new Set(entries.map(e => e.date))).sort().reverse();
            let streak = 0;
            if (dates.length > 0) {
                const today = new Date().toISOString().split('T')[0];
                const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
                
                // If there's an entry today or yesterday, count streak
                if (dates[0] === today || dates[0] === yesterday) {
                    streak = 1;
                    let curr = new Date(dates[0]);
                    for (let i = 1; i < dates.length; i++) {
                        let prev = new Date(dates[i]);
                        let diffDays = Math.round((curr - prev) / (1000 * 60 * 60 * 24));
                        if (diffDays === 1) {
                            streak++;
                            curr = prev;
                        } else {
                            break;
                        }
                    }
                }
            }
            document.getElementById('stat-streak').innerText = streak;

            // Top Mood
            const moodCounts = {};
            entries.forEach(e => { moodCounts[e.mood] = (moodCounts[e.mood] || 0) + 1; });
            let topMood = '-';
            let maxMoodCount = 0;
            for (let m in moodCounts) {
                if (moodCounts[m] > maxMoodCount) {
                    maxMoodCount = moodCounts[m];
                    topMood = m;
                }
            }
            document.getElementById('stat-top-mood').innerText = topMood;

            // Top Tag
            const tagCounts = {};
            entries.forEach(e => {
                e.tags.forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; });
            });
            let topTag = '-';
            let maxTagCount = 0;
            for (let t in tagCounts) {
                if (tagCounts[t] > maxTagCount) {
                    maxTagCount = tagCounts[t];
                    topTag = `#${t}`;
                }
            }
            document.getElementById('stat-top-tag').innerText = topTag;
        }

        // --- Render List View ---
        function renderEntries() {
            const container = document.getElementById('entries-container');
            const emptyState = document.getElementById('empty-state');
            const searchKeyword = document.getElementById('search-input').value.toLowerCase().trim();
            const moodFilter = document.getElementById('filter-mood').value;
            const tagFilter = document.getElementById('filter-tag').value;
            const sortOrder = document.getElementById('sort-order').value;

            // Filter
            let filtered = entries.filter(item => {
                const matchKeyword = !searchKeyword || 
                    item.title.toLowerCase().includes(searchKeyword) || 
                    item.content.toLowerCase().includes(searchKeyword) ||
                    item.tags.some(t => t.toLowerCase().includes(searchKeyword));
                
                const matchMood = moodFilter === 'ALL' || item.mood === moodFilter;
                const matchTag = tagFilter === 'ALL' || item.tags.includes(tagFilter);

                return matchKeyword && matchMood && matchTag;
            });

            // Sort
            filtered.sort((a, b) => {
                return sortOrder === 'desc' 
                    ? new Date(b.date) - new Date(a.date) 
                    : new Date(a.date) - new Date(b.date);
            });

            container.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                filtered.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "bg-white dark:bg-stone-800 rounded-2xl border border-stone-200/80 dark:border-stone-700/50 overflow-hidden shadow-sm hover:shadow-md transition-all duration-200 flex flex-col group cursor-pointer";
                    card.onclick = () => openDetailModal(item.id);

                    const imgHtml = item.image 
                        ? `<div class="h-44 w-full overflow-hidden bg-stone-100 dark:bg-stone-900 relative">
                             <img src="${item.image}" alt="Diary cover" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.style.display='none'">
                           </div>` 
                        : '';

                    const tagsHtml = item.tags.map(t => `<span class="inline-block bg-stone-100 dark:bg-stone-700/50 text-stone-600 dark:text-stone-300 text-xs px-2.5 py-1 rounded-md">#${t}</span>`).join(' ');

                    card.innerHTML = `
                        ${imgHtml}
                        <div class="p-5 flex-1 flex flex-col justify-between space-y-3">
                            <div>
                                <div class="flex items-center justify-between text-xs text-stone-400 mb-2">
                                    <span class="flex items-center gap-1.5 font-medium"><i class="fa-regular fa-calendar"></i> ${item.date}</span>
                                    <span class="text-xl" title="心情">${item.mood}</span>
                                </div>
                                <h3 class="font-bold text-base text-stone-800 dark:text-stone-100 line-clamp-1 group-hover:text-primary-600 dark:group-hover:text-primary-400 transition-colors">${escapeHtml(item.title)}</h3>
                                <p class="text-xs text-stone-600 dark:text-stone-300 line-clamp-3 mt-1.5 leading-relaxed">${escapeHtml(item.content)}</p>
                            </div>
                            ${item.tags.length ? `<div class="flex flex-wrap gap-1.5 pt-2 border-t border-stone-100 dark:border-stone-700/40">${tagsHtml}</div>` : ''}
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function updateTagFilterOptions() {
            const select = document.getElementById('filter-tag');
            const currentSelected = select.value;
            const allTags = new Set();
            entries.forEach(e => e.tags.forEach(t => allTags.add(t)));

            select.innerHTML = '<option value="ALL">全部標籤</option>';
            allTags.forEach(tag => {
                const opt = document.createElement('option');
                opt.value = tag;
                opt.innerText = `# ${tag}`;
                if (tag === currentSelected) opt.selected = true;
                select.appendChild(opt);
            });
        }

        // --- Render Calendar View ---
        function renderCalendar() {
            const monthYearText = document.getElementById('calendar-month-year');
            const calendarDays = document.getElementById('calendar-days');
            calendarDays.innerHTML = '';

            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();

            monthYearText.innerText = `${year} 年 ${month + 1} 月`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Map entries by date
            const entryMap = {};
            entries.forEach(e => {
                entryMap[e.date] = e;
            });

            // Empty slots for previous month
            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "h-20 rounded-xl bg-stone-50/50 dark:bg-stone-900/30 border border-transparent";
                calendarDays.appendChild(emptyCell);
            }

            // Days of current month
            const todayStr = new Date().toISOString().split('T')[0];

            for (let day = 1; day <= daysInMonth; day++) {
                const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasEntry = entryMap[dayStr];
                const isToday = dayStr === todayStr;

                const cell = document.createElement('div');
                cell.className = `h-20 rounded-xl p-2 border flex flex-col justify-between transition relative group cursor-pointer ${
                    isToday ? 'border-primary-500 bg-primary-50/30 dark:bg-primary-950/20' : 'border-stone-100 dark:border-stone-700/50 bg-white dark:bg-stone-800'
                }`;

                cell.onclick = () => {
                    if (hasEntry) {
                        openDetailModal(hasEntry.id);
                    } else {
                        openEntryModal(dayStr);
                    }
                };

                cell.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-semibold ${isToday ? 'text-primary-600 dark:text-primary-400 font-bold' : 'text-stone-600 dark:text-stone-400'}">${day}</span>
                        ${hasEntry ? `<span class="text-base">${hasEntry.mood}</span>` : ''}
                    </div>
                    ${hasEntry ? `<div class="text-[11px] font-medium text-stone-700 dark:text-stone-300 truncate group-hover:text-primary-600 dark:group-hover:text-primary-400">${escapeHtml(hasEntry.title)}</div>` : ''}
                `;
                calendarDays.appendChild(cell);
            }
        }

        function changeMonth(offset) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + offset);
            renderCalendar();
        }

        function goToCurrentMonth() {
            currentCalendarDate = new Date();
            renderCalendar();
        }

        // --- Render Charts & Tag Cloud ---
        function renderChart() {
            const isDark = document.documentElement.classList.contains('dark');
            const moodCounts = { '😊': 0, '😌': 0, '🥰': 0, '😔': 0, '😤': 0, '😴': 0 };
            
            entries.forEach(e => {
                if (moodCounts[e.mood] !== undefined) moodCounts[e.mood]++;
            });

            const ctx = document.getElementById('moodChart').getContext('2d');
            
            if (moodChartInstance) {
                moodChartInstance.destroy();
            }

            moodChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['開心 😊', '平靜 😌', '感恩 🥰', '低落 😔', '焦慮 😤', '疲憊 😴'],
                    datasets: [{
                        data: [moodCounts['😊'], moodCounts['😌'], moodCounts['🥰'], moodCounts['😔'], moodCounts['😤'], moodCounts['😴']],
                        backgroundColor: ['#f59e0b', '#10b981', '#ec4899', '#6366f1', '#ef4444', '#8b5cf6'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: isDark ? '#d6d3d1' : '#44403c',
                                font: { family: 'Inter', size: 12 }
                            }
                        }
                    }
                }
            });

            // Render Tag Cloud
            const tagCloud = document.getElementById('tag-cloud');
            tagCloud.innerHTML = '';
            const tagCounts = {};
            entries.forEach(e => {
                e.tags.forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; });
            });

            if (Object.keys(tagCounts).length === 0) {
                tagCloud.innerHTML = `<span class="text-xs text-stone-400">目前尚無標籤數據</span>`;
            } else {
                for (let t in tagCounts) {
                    const count = tagCounts[t];
                    const tagEl = document.createElement('span');
                    tagEl.className = "inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-stone-100 dark:bg-stone-700/60 text-stone-700 dark:text-stone-200 text-xs font-medium";
                    tagEl.innerHTML = `# ${escapeHtml(t)} <span class="px-1.5 py-0.5 rounded-md bg-stone-200 dark:bg-stone-600 text-[10px] text-stone-500 dark:text-stone-300">${count}</span>`;
                    tagCloud.appendChild(tagEl);
                }
            }
        }

        // --- Modals & CRUD ---
        function openEntryModal(dateStr = null) {
            document.getElementById('modal-title').innerText = '撰寫新日記';
            document.getElementById('entry-id').value = '';
            document.getElementById('entry-date').value = dateStr || new Date().toISOString().split('T')[0];
            document.getElementById('entry-title').value = '';
            document.getElementById('entry-content').value = '';
            document.getElementById('entry-image').value = '';
            document.getElementById('entry-tags').value = '';
            selectMood('😊');

            document.getElementById('btn-delete').classList.add('hidden');

            const modal = document.getElementById('entry-modal');
            const panel = document.getElementById('entry-modal-panel');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            panel.classList.remove('scale-95');
            panel.classList.add('scale-100');
        }

        function closeEntryModal() {
            const modal = document.getElementById('entry-modal');
            const panel = document.getElementById('entry-modal-panel');
            panel.classList.remove('scale-100');
            panel.classList.add('scale-95');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function selectMood(mood) {
            document.getElementById('entry-mood').value = mood;
            document.querySelectorAll('.mood-btn').forEach(btn => {
                if (btn.getAttribute('data-mood') === mood) {
                    btn.classList.add('bg-white', 'dark:bg-stone-800', 'shadow-sm', 'scale-110');
                } else {
                    btn.classList.remove('bg-white', 'dark:bg-stone-800', 'shadow-sm', 'scale-110');
                }
            });
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            const id = document.getElementById('entry-id').value || Date.now().toString();
            const date = document.getElementById('entry-date').value;
            const mood = document.getElementById('entry-mood').value;
            const title = document.getElementById('entry-title').value.trim();
            const content = document.getElementById('entry-content').value.trim();
            const image = document.getElementById('entry-image').value.trim();
            const tagsInput = document.getElementById('entry-tags').value;
            const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(Boolean) : [];

            const existingIndex = entries.findIndex(e => e.id === id);
            const entryObj = { id, date, mood, title, content, image, tags };

            if (existingIndex >= 0) {
                entries[existingIndex] = entryObj;
                showToast('日記已成功更新！');
            } else {
                entries.unshift(entryObj);
                showToast('已新增一篇日記！');
            }

            saveEntries();
            closeEntryModal();
        }

        function openDetailModal(id) {
            const item = entries.find(e => e.id === id);
            if (!item) return;

            const modal = document.getElementById('detail-modal');
            const panel = document.getElementById('detail-modal-panel');
            const content = document.getElementById('detail-content');

            const tagsHtml = item.tags.map(t => `<span class="inline-block bg-stone-100 dark:bg-stone-700/50 text-stone-600 dark:text-stone-300 text-xs px-2.5 py-1 rounded-md">#${t}</span>`).join(' ');

            content.innerHTML = `
                <div class="flex items-center justify-between pb-4 border-b border-stone-100 dark:border-stone-700">
                    <div class="flex items-center gap-2 text-sm text-stone-500 dark:text-stone-400 font-medium">
                        <i class="fa-regular fa-calendar"></i> ${item.date}
                        <span class="text-xl ml-2">${item.mood}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="editEntry('${item.id}')" class="px-3 py-1.5 rounded-xl bg-stone-100 dark:bg-stone-700 text-stone-700 dark:text-stone-200 text-xs font-medium hover:bg-stone-200 dark:hover:bg-stone-600 transition">
                            <i class="fa-solid fa-pen-to-square mr-1"></i> 編輯
                        </button>
                        <button onclick="closeDetailModal()" class="p-1.5 rounded-full text-stone-400 hover:text-stone-600">
                            <i class="fa-solid fa-xmark text-lg"></i>
                        </button>
                    </div>
                </div>
                <h2 class="text-xl font-bold text-stone-800 dark:text-stone-100 pt-2">${escapeHtml(item.title)}</h2>
                ${item.image ? `<img src="${item.image}" alt="Cover" class="w-full max-h-80 object-cover rounded-2xl shadow-sm my-3" onerror="this.style.display='none'">` : ''}
                <div class="text-stone-700 dark:text-stone-200 text-sm leading-relaxed whitespace-pre-wrap py-2">${escapeHtml(item.content)}</div>
                ${item.tags.length ? `<div class="flex flex-wrap gap-1.5 pt-4 border-t border-stone-100 dark:border-stone-700/50">${tagsHtml}</div>` : ''}
            `;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            panel.classList.remove('scale-95');
            panel.classList.add('scale-100');
        }

        function closeDetailModal() {
            const modal = document.getElementById('detail-modal');
            const panel = document.getElementById('detail-modal-panel');
            panel.classList.remove('scale-100');
            panel.classList.add('scale-95');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function editEntry(id) {
            closeDetailModal();
            const item = entries.find(e => e.id === id);
            if (!item) return;

            document.getElementById('modal-title').innerText = '編輯日記';
            document.getElementById('entry-id').value = item.id;
            document.getElementById('entry-date').value = item.date;
            document.getElementById('entry-title').value = item.title;
            document.getElementById('entry-content').value = item.content;
            document.getElementById('entry-image').value = item.image || '';
            document.getElementById('entry-tags').value = item.tags.join(', ');
            selectMood(item.mood);

            document.getElementById('btn-delete').classList.remove('hidden');

            const modal = document.getElementById('entry-modal');
            const panel = document.getElementById('entry-modal-panel');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            panel.classList.remove('scale-95');
            panel.classList.add('scale-100');
        }

        function deleteCurrentEntry() {
            const id = document.getElementById('entry-id').value;
            if (!id) return;

            if (confirm('確定要刪除這篇日記嗎？此動作無法復原。')) {
                entries = entries.filter(e => e.id !== id);
                saveEntries();
                closeEntryModal();
                showToast('日記已成功刪除');
            }
        }

        // --- Backup & Restore ---
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `mindful_log_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('備份檔案已成功下載！');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedEntries = JSON.parse(e.target.result);
                    if (Array.isArray(importedEntries)) {
                        entries = importedEntries;
                        saveEntries();
                        showToast('成功匯入日記備份數據！');
                    } else {
                        showToast('匯入失敗：檔案格式不符合規範', true);
                    }
                } catch (err) {
                    showToast('匯入失敗：無效的 JSON 檔案', true);
                }
            };
            reader.readAsText(file);
        }

        // --- Utilities ---
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMessage.innerText = message;
            if (isError) {
                toastIcon.className = "fa-solid fa-circle-xmark text-rose-500";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400 dark:text-emerald-600";
            }

            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&raw_gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
