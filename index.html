<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mindful Log - 雲端隨身日記本</title>
   
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Firebase SDKs (v10.8.0) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      deleteDoc, 
      updateDoc, 
      doc, 
      query, 
      where, 
      orderBy, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 您的 Firebase 專案設定
    const firebaseConfig = {
      apiKey: "AIzaSyCKqVL5JBI0peEnDm0dlipBQKhCtGKgaBs",
      authDomain: "my-journal-app-6dd60.firebaseapp.com",
      projectId: "my-journal-app-6dd60",
      storageBucket: "my-journal-app-6dd60.firebasestorage.app",
      messagingSenderId: "1022800855539",
      appId: "1:1022800855539:web:3207459e2c51db32a49286"
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
  
  
    // 全域變數
    let currentUser = null;
    let unsubscribeJournals = null;
    let journalsData = [];

    // UI 元素參考
    const authOverlay = document.getElementById('auth-overlay');
    const appContent = document.getElementById('app-content');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userAvatar = document.getElementById('user-avatar');
    const userName = document.getElementById('user-name');
    const journalForm = document.getElementById('journal-form');
    const journalsList = document.getElementById('journals-list');
    const emptyState = document.getElementById('empty-state');
    const streakCount = document.getElementById('streak-count');
    const totalCount = document.getElementById('total-count');

    // ==========================================
    // 2. 身分驗證 (Authentication) 邏輯
    // ==========================================
    loginBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("登入失敗:", error);
        alert("登入失敗，請確認 Firebase 設定或授權網域 (Authorized Domains)");
      }
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (error) {
        console.error("登出失敗:", error);
      }
    });

    // 監聽登入狀態改變
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        userName.textContent = user.displayName || user.email;
        userAvatar.src = user.photoURL || 'https://via.placeholder.com/40';
        authOverlay.classList.add('hidden');
        appContent.classList.remove('hidden');
        
        // 訂閱當前使用者的 Firestore 即時資料
        listenToJournals(user.uid);
      } else {
        currentUser = null;
        if (unsubscribeJournals) unsubscribeJournals();
        authOverlay.classList.remove('hidden');
        appContent.classList.add('hidden');
        journalsData = [];
      }
    });

    // ==========================================
    // 3. Cloud Firestore 資料讀寫邏輯
    // ==========================================
    function listenToJournals(uid) {
      const q = query(
        collection(db, "journals"),
        where("uid", "==", uid),
        orderBy("date", "desc")
      );

      // 即時監聽資料庫變化
      unsubscribeJournals = onSnapshot(q, (snapshot) => {
        journalsData = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));
        renderJournals();
        updateStats();
      }, (error) => {
        console.error("讀取資料失敗:", error);
      });
    }

    // 新增日記
    journalForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const title = document.getElementById('entry-title').value;
      const mood = document.getElementById('entry-mood').value;
      const date = document.getElementById('entry-date').value;
      const content = document.getElementById('entry-content').value;

      try {
        await addDoc(collection(db, "journals"), {
          uid: currentUser.uid,
          title,
          mood,
          date,
          content,
          createdAt: new Date().toISOString()
        });
        
        journalForm.reset();
        document.getElementById('entry-date').valueAsDate = new Date();
      } catch (error) {
        console.error("儲存失敗:", error);
        alert("儲存日記失敗，請再試一次");
      }
    });

    // 刪除日記
    window.deleteJournal = async (id) => {
      if (confirm("確定要刪除這篇日記嗎？")) {
        try {
          await deleteDoc(doc(db, "journals", id));
        } catch (error) {
          console.error("刪除失敗:", error);
        }
      }
    };

    // ==========================================
    // 4. 畫面渲染與統計邏輯
    // ==========================================
    function renderJournals() {
      journalsList.innerHTML = '';
      if (journalsData.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      journalsData.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white p-6 rounded-2xl border border-stone-200/80 shadow-sm transition hover:shadow-md";
        card.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center space-x-3">
              <span class="text-2xl">${item.mood || '📝'}</span>
              <div>
                <h3 class="font-bold text-stone-800 text-lg">${escapeHtml(item.title)}</h3>
                <span class="text-xs text-stone-400 font-mono">${item.date}</span>
              </div>
            </div>
            <button onclick="deleteJournal('${item.id}')" class="text-stone-400 hover:text-rose-500 transition p-1">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
          <p class="text-stone-600 text-sm whitespace-pre-line leading-relaxed">${escapeHtml(item.content)}</p>
        `;
        journalsList.appendChild(card);
      });
      lucide.createIcons();
    }

    function updateStats() {
      totalCount.textContent = journalsData.length;
      
      // 計算連續天數 (Streak)
      if (journalsData.length === 0) {
        streakCount.textContent = 0;
        return;
      }

      const dates = [...new Set(journalsData.map(j => j.date))].sort().reverse();
      let streak = 0;
      let checkDate = new Date();

      for (let i = 0; i < dates.length; i++) {
        const dateStr = checkDate.toISOString().split('T')[0];
        if (dates.includes(dateStr)) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else if (i === 0) {
          // 檢查昨天是否有寫
          checkDate.setDate(checkDate.getDate() - 1);
          const yesterdayStr = checkDate.toISOString().split('T')[0];
          if (dates.includes(yesterdayStr)) {
            streak++;
            checkDate.setDate(checkDate.getDate() - 1);
          } else {
            break;
          }
        } else {
          break;
        }
      }
      streakCount.textContent = streak;
    }

    function escapeHtml(str) {
      return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : '';
    }

    // 初始化日期欄位
    document.getElementById('entry-date').valueAsDate = new Date();
  </script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans min-h-screen antialiased">

  <!-- 未登入遮罩視窗 -->
  <div id="auth-overlay" class="fixed inset-0 bg-stone-900/40 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center border border-stone-100">
      <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <i data-lucide="book-open" class="w-8 h-8"></i>
      </div>
      <h2 class="text-2xl font-bold text-stone-800 mb-2">Mindful Log</h2>
      <p class="text-stone-500 text-sm mb-6">請使用您的 Google 帳號登入以開啟專屬雲端日記本。</p>
      <button id="login-btn" class="w-full bg-stone-900 text-white font-medium py-3 px-4 rounded-xl hover:bg-stone-800 transition flex items-center justify-center space-x-2 shadow-sm">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>使用 Google 帳號登入</span>
      </button>
    </div>
  </div>

  <!-- 主要應用程式內容區塊 -->
  <div id="app-content" class="hidden max-w-4xl mx-auto px-4 py-8">
    
    <!-- 頂部導覽欄 -->
    <header class="flex items-center justify-between mb-8 pb-4 border-b border-stone-200">
      <div class="flex items-center space-x-3">
        <div class="p-2.5 bg-amber-500 text-white rounded-xl shadow-sm">
          <i data-lucide="notebook" class="w-6 h-6"></i>
        </div>
        <h1 class="text-xl font-bold text-stone-800 tracking-tight">Mindful Log</h1>
      </div>
      <div class="flex items-center space-x-4">
        <div class="flex items-center space-x-2">
          <img id="user-avatar" src="" alt="Avatar" class="w-8 h-8 rounded-full border border-stone-200">
          <span id="user-name" class="text-sm font-medium text-stone-600 hidden sm:inline"></span>
        </div>
        <button id="logout-btn" class="text-xs font-medium text-stone-500 hover:text-stone-800 p-2 rounded-lg hover:bg-stone-200/50 transition">
          登出
        </button>
      </div>
    </header>

    <!-- 數據概覽卡片 -->
    <div class="grid grid-cols-2 gap-4 mb-8">
      <div class="bg-amber-500/10 border border-amber-200/50 rounded-2xl p-4 flex items-center space-x-4">
        <div class="p-3 bg-amber-500 text-white rounded-xl">
          <i data-lucide="flame" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="text-xs text-amber-800 font-medium">連續紀錄</div>
          <div class="text-2xl font-extrabold text-amber-900"><span id="streak-count">0</span> 天</div>
        </div>
      </div>
      <div class="bg-stone-200/40 border border-stone-200/80 rounded-2xl p-4 flex items-center space-x-4">
        <div class="p-3 bg-stone-700 text-white rounded-xl">
          <i data-lucide="files" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="text-xs text-stone-600 font-medium">累積日記</div>
          <div class="text-2xl font-extrabold text-stone-800"><span id="total-count">0</span> 篇</div>
        </div>
      </div>
    </div>

    <!-- 主要內容 grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      
      <!-- 表單區域 (新增日記) -->
      <div class="md:col-span-1">
        <div class="bg-white p-6 rounded-2xl border border-stone-200/80 shadow-sm sticky top-6">
          <h2 class="text-lg font-bold text-stone-800 mb-4 flex items-center space-x-2">
            <i data-lucide="pen-tool" class="w-4 h-4 text-amber-500"></i>
            <span>寫下今天的故事</span>
          </h2>
          <form id="journal-form" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">標題</label>
              <input type="text" id="entry-title" required placeholder="給今天一個主題..." class="w-full px-3 py-2 text-sm border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/50">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">心情</label>
                <select id="entry-mood" class="w-full px-3 py-2 text-sm border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/50 bg-white">
                  <option value="😊">😊 開心</option>
                  <option value="🌿">🌿 平靜</option>
                  <option value="💡">💡 靈感</option>
                  <option value="☕">☕ 悠閒</option>
                  <option value="🌧️">🌧️ 低落</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">日期</label>
                <input type="date" id="entry-date" required class="w-full px-2 py-2 text-sm border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/50">
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">內容</label>
              <textarea id="entry-content" required rows="5" placeholder="今天發生了什麼事？感受如何？" class="w-full px-3 py-2 text-sm border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/50 resize-none"></textarea>
            </div>
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-2.5 rounded-xl transition shadow-sm text-sm flex items-center justify-center space-x-2">
              <i data-lucide="send" class="w-4 h-4"></i>
              <span>儲存到雲端</span>
            </button>
          </form>
        </div>
      </div>

      <!-- 日記列表區域 -->
      <div class="md:col-span-2 space-y-4">
        <div id="journals-list" class="space-y-4"></div>
        
        <!-- 空狀態顯示 -->
        <div id="empty-state" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-stone-200 p-8">
          <i data-lucide="feather" class="w-10 h-10 text-stone-300 mx-auto mb-3"></i>
          <p class="text-stone-500 font-medium text-sm">目前還沒有日記，從左側寫下第一篇吧！</p>
        </div>
      </div>

    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
